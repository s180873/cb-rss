name: fetch-rss
permissions:
  contents: write
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch.py
      - run: |
          git config user.name "rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add *.xml
          git commit -m "rss update" || echo "no changes"
          git push
